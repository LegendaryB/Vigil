services:
  vigil:
    image: vigil
    build:
      context: .
      dockerfile: src/Vigil/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configuration:/app/configuration:ro
    # Values referenced as ${VARIABLE_NAME} in configuration/vigil.yaml
    # (for example PROCYON_KEY). Keep this file out of git.
    env_file:
      - path: ./secrets/vigil.env
        required: false
    secrets:
      - source: admin_key
        target: AdminKey

secrets:
  admin_key:
    file: ./secrets/admin_key.txt
