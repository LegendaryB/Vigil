services:
  vigil:
    image: vigil
    build:
      context: .
      dockerfile: src/Vigil/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    secrets:
      - source: admin_key
        target: AdminKey

secrets:
  admin_key:
    file: ./secrets/admin_key.txt

